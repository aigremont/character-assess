<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment – {{ display_name }}</title>
    <style>
        body { font-family: sans-serif; max-width: 860px; margin: 40px auto; padding: 0 20px; background: #111; color: #ccc; }
        h1, h2, h3 { color: #fff; }
        .characters { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 30px; }
        .char-card { background: #1e1e1e; border: 1px solid #333; border-radius: 6px; padding: 14px 20px; min-width: 180px; }
        .char-card .light { font-size: 1.4rem; font-weight: bold; color: #f0c040; }
        .char-card .label { font-size: 0.85rem; color: #888; }
        .assessment { background: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 24px; line-height: 1.7; }
        .assessment h2 { border-bottom: 1px solid #333; padding-bottom: 6px; }
        a { color: #4a90d9; }
        .actions { margin-top: 24px; }
        a.btn { display: inline-block; padding: 10px 20px; background: #4a90d9; color: #fff; text-decoration: none; border-radius: 4px; margin-right: 10px; }
        a.btn.grey { background: #444; }
        code { background: #222; padding: 2px 6px; border-radius: 3px; }
        pre { background: #222; padding: 12px; border-radius: 4px; overflow-x: auto; }
        ul, ol { padding-left: 1.4em; }
    </style>
</head>
<body>
    <h1>Assessment for {{ display_name }}</h1>

    <div class="characters">
        {% for c in characters %}
        <div class="char-card">
            <div class="label">{{ c.race }} {{ c.class }}</div>
            <div class="light">{{ c.light }}</div>
            <div class="label">Power Level</div>
        </div>
        {% endfor %}
    </div>

    <div class="assessment">
        {{ assessment_html | safe }}
    </div>

    <div class="actions">
        <a class="btn" href="/assess">Re-assess</a>
        <a class="btn grey" href="/logout">Logout</a>
    </div>
</body>
</html>
