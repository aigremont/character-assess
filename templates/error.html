<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error – Destiny 2 Progression Assessor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e1a;
            color: #c8d0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            max-width: 540px;
            padding: 40px 20px;
        }
        .error-icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        h1 {
            color: #c04040;
            font-size: 1.6rem;
            margin-bottom: 16px;
        }
        .message {
            background: #1a0f0f;
            border: 1px solid #4a1a1a;
            border-radius: 6px;
            padding: 16px 20px;
            color: #c08080;
            font-family: monospace;
            font-size: 0.95rem;
            text-align: left;
            word-break: break-word;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            padding: 12px 28px;
            background: linear-gradient(135deg, #b89a4e, #8a6f2e);
            color: #0a0e1a;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: all 0.2s;
            margin: 6px;
        }
        .btn:hover {
            background: linear-gradient(135deg, #d4b86a, #b89a4e);
        }
        .btn-secondary {
            background: transparent;
            color: #8090a8;
            border: 1px solid #2a3a5a;
        }
        .btn-secondary:hover {
            color: #b89a4e;
            border-color: #b89a4e;
            background: transparent;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-icon">⚠</div>
        <h1>Something went wrong</h1>
        <div class="message">{{ message }}</div>
        <a href="/" class="btn">Go Home</a>
        <a href="/logout" class="btn btn-secondary">Logout &amp; Retry</a>
    </div>
</body>
</html>
